[package]
name = "rauthy_provisioner"
version = "0.1.0"
edition = "2021"

[dependencies]
spow = { version = "0.7", features = ["server", "client"] }
reqwest = { version = "0.12", features = ["json", "cookies", "rustls-tls"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
anyhow = "1"
