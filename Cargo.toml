[package]
name = "avrig"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "Unified cross-platform avrig runtime"
build = "build.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
async-stream = "0.3"
avrig-logging = { path = "../avrig-lib/crates/avrig-logging" }
avrig-gateway = { path = "../avrig-lib/crates/avrig-gateway" }
tower = { version = "0.5", features = ["util"] }
jsonwebtoken = "9"
notify = "8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "multipart", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
thiserror = "2"
tokio-util = "0.7"
toml = "0.8"
tracing = "0.1"
tokio-postgres = { version = "0.7", features = ["with-uuid-1", "with-chrono-0_4"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
csv = "1.3"
quick-xml = "0.37"
lopdf = "0.35"
zip = { version = "2.2", default-features = false, features = ["deflate"] }
rust-embed = "8"
mime_guess = "2"

[target.'cfg(windows)'.dependencies]
fastembed = { version = "7", default-features = false, features = ["onnx", "ort-download-binaries", "directml", "hf-hub"] }
ort = { version = "2.0.0-rc.15", default-features = false, features = ["directml"] }

[target.'cfg(not(windows))'.dependencies]
fastembed = { version = "7", default-features = false, features = ["onnx", "ort-download-binaries", "hf-hub"] }
ort = { version = "2.0.0-rc.15", default-features = false }

[dev-dependencies]
tempfile = "3"
